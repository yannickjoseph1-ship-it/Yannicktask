<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration d'un aquarium">
  <rect width="800" height="600" fill="#ffffff"/>
  <defs>
    <g id="fish" fill="#000080">
      <path d="M0 0 C 25 -28, 70 -28, 95 0 C 70 28, 25 28, 0 0 Z"/>
      <path d="M0 0 L -32 -26 L -22 0 L -32 26 Z"/>
      <path d="M45 -16 L 60 -36 L 72 -14 Z"/>
      <circle cx="78" cy="-4" r="5" fill="#ffffff"/>
    </g>
  </defs>
  <g fill="none" stroke="#000080" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Meuble -->
    <line x1="150" y1="520" x2="650" y2="520"/>
    <line x1="200" y1="520" x2="200" y2="560"/>
    <line x1="600" y1="520" x2="600" y2="560"/>
    <!-- Bac -->
    <rect x="140" y="120" width="520" height="400" rx="18"/>
    <!-- Rampe LED -->
    <rect x="200" y="86" width="400" height="22" rx="11"/>
    <line x1="400" y1="108" x2="400" y2="120"/>
    <!-- Ligne d'eau -->
    <path d="M170 190 C 230 170, 270 210, 330 190 S 430 170, 490 190 S 590 210, 630 190"/>
    <!-- Reflet -->
    <line x1="175" y1="250" x2="175" y2="330" stroke-width="10" opacity="0.5"/>
  </g>
  <g fill="#000080">
    <!-- Sol -->
    <path d="M152 460 C 220 440, 300 480, 400 462 S 580 445, 648 470 L 648 502 Q 648 508 642 508 L 158 508 Q 152 508 152 502 Z"/>
    <!-- Roches -->
    <path d="M190 470 C 200 420, 290 420, 300 470 Z"/>
    <path d="M520 475 C 535 430, 610 430, 625 475 Z"/>
    <!-- Plantes gauche -->
    <path d="M232 462 C 200 400, 200 320, 240 250 C 250 330, 245 400, 232 462 Z"/>
    <path d="M262 462 C 250 390, 270 300, 320 240 C 300 320, 285 400, 262 462 Z"/>
    <path d="M300 462 C 310 400, 330 350, 355 320 C 340 380, 325 430, 300 462 Z"/>
    <!-- Plantes droite (feuilles rondes) -->
    <path d="M560 468 C 560 420, 540 400, 560 360 C 580 400, 560 420, 560 468 Z"/>
    <ellipse cx="540" cy="380" rx="22" ry="14" transform="rotate(-30 540 380)"/>
    <ellipse cx="582" cy="350" rx="22" ry="14" transform="rotate(30 582 350)"/>
    <ellipse cx="536" cy="420" rx="20" ry="12" transform="rotate(-20 536 420)"/>
    <ellipse cx="586" cy="410" rx="20" ry="12" transform="rotate(20 586 410)"/>
    <!-- Racine -->
    <path d="M380 470 C 400 440, 430 430, 470 440 L 480 455 C 440 448, 415 458, 400 478 Z"/>
    <!-- Poissons -->
    <use href="#fish" transform="translate(330 270)"/>
    <use href="#fish" transform="translate(450 330) scale(-0.8 0.8)"/>
    <use href="#fish" transform="translate(420 240) scale(0.6)"/>
    <use href="#fish" transform="translate(540 290) scale(-0.55 0.55)"/>
    <use href="#fish" transform="translate(250 360) scale(0.5)"/>
    <!-- Bulles -->
    <g fill="none" stroke="#000080" stroke-width="8">
      <circle cx="600" cy="250" r="8"/>
      <circle cx="585" cy="225" r="6"/>
      <circle cx="605" cy="205" r="5"/>
    </g>
  </g>
</svg>
